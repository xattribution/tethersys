[workspace]
resolver = "3"
members = ["crates/tethersys", "crates/tethersysd", "crates/tethersys-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xattribution/tethersys"

[workspace.dependencies]
tethersys = { path = "crates/tethersys" }
iroh = "1.3"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
iroh-mdns-address-lookup = "0.6"
iroh-mainline-address-lookup = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
blake3 = "1.8"
data-encoding = "2.6"
n0-future = "0.3"
rand = "0.10"
curve25519-dalek = "5"
chacha20poly1305 = "0.10"
subtle = "2.6"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
